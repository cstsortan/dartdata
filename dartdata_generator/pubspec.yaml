name: dartdata_generator
description: build_runner code generator for the dartdata package.
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  # Code generation infrastructure
  build: ^2.4.0
  source_gen: ^1.5.0
  analyzer: ^6.4.0
  # The annotations we read
  dartdata:
    path: ../dartdata

dev_dependencies:
  build_test: ^2.2.0
  test: ^1.24.0
  lints: ^3.0.0
